<style>

/* --- 18 Oct 2026: Instagram + TikTok on the same card --- */

.it .bd{display:flex;flex-direction:column;gap:3px;flex:none;align-items:flex-end}

.how h4{font-size:13px;color:var(--mute);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.08em}

</style>

  var CTA='\n\nLink στο bio, ή στείλτε μας «ΣΕΛΙΔΑ» σε μήνυμα. Όλες οι κριτικές μας: @advon_media\n\n#κατασκευήιστοσελίδων #ιστοσελίδα #webdesign #ιατρός #ψυχολόγος #οδοντίατρος #advonmedia';

   {id:'bk-AD1-master',title:'Δωρεάν κατασκευή ιστοσελίδας',kind:'Ad 1 · Panos · 51 s · with sound effects · allsmiles, davou, plessa, papaioannou',video:S+'backup/AD1-master.mp4',cover:S+'backup/AD1-master-cover.jpg',
    caption:'Δωρεάν κατασκευή ιστοσελίδας.\n\nΠληρώνετε μόνο φιλοξενία & domain: 130€ τον χρόνο, δηλαδή 10,83€ τον μήνα. Χωρίς προκαταβολή: πρώτα βλέπετε ένα draft, και μετά πληρώνετε. Όσες αλλαγές θέλετε, μέχρι να είναι ακριβώς όπως τη φανταστήκατε.\n\n220+ ιστοσελίδες online · 125+ κριτικές στο Google, όλες 5 αστέρων. Λιγότερο από 1 ώρα από εσάς, τα υπόλοιπα τα αναλαμβάνουμε εμείς.'+CTA,
    tiktok:'Δωρεάν κατασκευή ιστοσελίδας. Πρώτα βλέπετε το draft, μετά αποφασίζετε. #ιστοσελίδα #γιατρός #ψυχολόγος #webdesign #advonmedia'},
   {id:'bk-B-pain',title:'Οι ασθενείς σας σάς ψάχνουν στο Google. Τι βρίσκουν;',kind:'Video B · Pain · 45 s',video:S+'backup/B-pain.mp4',cover:S+'backup/B-pain-cover.jpg',
    caption:'Οι ασθενείς σας σάς ψάχνουν στο Google. Τι βρίσκουν;\n\nΑν δεν βρίσκουν μια δική σας ιστοσελίδα, βρίσκουν κάποιον άλλο. Εμείς τη φτιάχνουμε, και την κατασκευή δεν τη χρεώνουμε.\n\n✓ Πληρώνετε μόνο φιλοξενία και domain: 130€ τον χρόνο (10,83€ τον μήνα)\n✓ Χωρίς προκαταβολή: πρώτα βλέπετε το σχέδιο, μετά πληρώνετε\n✓ Όσες αλλαγές θέλετε, μέχρι να είναι όπως τη φανταστήκατε\n✓ 220+ ιστοσελίδες online · 125+ κριτικές 5★ στο Google'+CTA,
    tiktok:'Οι ασθενείς σας σάς ψάχνουν στο Google. Τι βρίσκουν; #ιστοσελίδα #γιατρός #ψυχολόγος #οδοντίατρος #advonmedia'}];
  var NAME={'sales-X1-master-pro':'Δωρεάν κατασκευή ιστοσελίδας','sales-X4-google-test':'Κάντε ένα μικρό τεστ στο Google'};
  var FIRST_A=['bk-AD1-master','sales-E-anipsios','bk-B-pain','sales-3-erotiseis','sales-min-plirwsete','sales-pagida-hook1','sales-L-fortwnei',
    'sales-K-xrysos-odigos','sales-A-giatros-psychologos','sales-N-mathimatika','sales-B-poso-xrono','sales-O-ptyxia','sales-C-ti-tha-paei-strava',

  var $=function(s,r){return (r||document).querySelector(s)};

  function igDone(id,pp){return J('advon-ig'+(pp||P)+'-done')[id]}
  function ttDone(id){return TT_ON[id]||J(TT_DONE)[id]}

  var tt;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2600)}
  function fmt(iso){try{return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}catch(e){return ''}}

  // ---- ticks saved on the server (advonmedia.com/api/tiktok), with a local copy that retries until it is sent
  function send(sid,on,at){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({id:sid,on:on,at:at}),cache:'no-store'}).then(function(r){return r.json()}).then(function(j){if(!j||!j.ok)throw new Error('not saved');return j})}

  }

  function syncDone(){
    return fetch(API,{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){

  function copy(text){
    if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(text).then(function(){return true},function(){return legacy(text)})}
    return Promise.resolve(legacy(text));
  }
  function legacy(text){var a=document.createElement('textarea');a.value=text;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(a);a.select();a.setSelectionRange(0,text.length);var ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();return ok}

  // the video is fetched once and kept, so the share sheet opens straight from the tap (iOS needs the file ready)
  function prepare(p,onp){
    if(blobs[p.id])return Promise.resolve(blobs[p.id]);

      function pump(){return rd.read().then(function(x){if(x.done)return new Blob(parts,{type:'video/mp4'});parts.push(x.value);have+=x.value.length;onp&&tot&&onp(Math.min(99,Math.round(have/tot*100)));return pump()})}

  var TTI='<svg viewBox="0 0 24 24" fill="#fff"><path d="M16.6 3c.4 2.2 1.8 3.7 4 3.9v3.1c-1.5 0-2.8-.4-4-1.2v6.1c0 3.4-2.6 5.9-5.9 5.9S4.8 18.3 4.8 15c0-3.4 2.8-6 6.3-5.8v3.2c-1.6-.3-3 .9-3 2.6 0 1.5 1.2 2.6 2.7 2.6 1.6 0 2.8-1.2 2.8-2.9V3h3z"/></svg>';

    var ig=igDone(p.id), tk=ttDone(p.id), both=ig&&tk, isToday=p===today();
    var h='<section class="hero">'+
      '<div class="when"><b>'+(both?'Done ✓':isToday?'Today’s reel':'Reel '+(data.indexOf(p)+1))+' · '+(data.indexOf(p)+1)+' of '+data.length+'</b>'+
        '<span class="tag'+(both?' done':'')+'">'+(both?'Instagram + TikTok ✓':(ig?'IG ✓':'IG –')+' · '+(tk?'TikTok ✓':'TikTok –'))+'</span></div>'+
      '<div class="media"><video src="'+esc(p.video)+'#t=0.1" poster="'+esc(p.cover)+'" controls playsinline preload="metadata"></video></div>'+
      '<h1>'+esc(p.title)+'</h1>'+(p.kind?'<p class="sub">'+esc(p.kind)+'</p>':'');
    // 1 · Instagram
    h+='<div class="step ig'+(ig?' okd':'')+'"><h3><span class="ico">'+IGI+'</span>1 · Instagram @'+HANDLE[P]+'<span class="st'+(ig?' ok':'')+'">'+(ig?'Posted '+fmt(ig)+' ✓':'To post')+'</span></h3>'+
      '<button class="btn b1" id="bCopy" type="button"><span class="k">1</span>Copy Instagram caption</button>'+
      '<button class="btn b2 js-share" data-pl="ig" type="button"><span class="k">2</span><span class="lbl">Open in Instagram</span></button>'+
      '<button class="btn b3'+(ig?' on':'')+'" id="bIg" type="button">'+(ig?'✓ Posted on Instagram — tap to undo':'I posted it on Instagram ✓')+'</button>'+
    '</div>';
    // 2 · TikTok
    if(TT_ON[p.id]){
      h+='<div class="step tk okd"><h3><span class="ico">'+TTI+'</span>2 · TikTok @advonmedia<span class="st ok">Already posted</span></h3>'+
        '<p class="already"><b>Already on TikTok</b> since '+esc(TT_ON[p.id])+'. Nothing to do on TikTok for this one, just post it on Instagram.</p></div>';
    }else{
      h+='<div class="step tk'+(tk?' okd':'')+'"><h3><span class="ico">'+TTI+'</span>2 · TikTok @advonmedia<span class="st'+(tk?' ok':'')+'">'+(tk?'Posted '+fmt(tk)+' ✓':'To post')+'</span></h3>'+
        '<button class="btn b1" id="bCopyT" type="button"><span class="k">1</span>Copy TikTok caption</button>'+
        '<button class="btn bt js-share" data-pl="tt" type="button"><span class="k">2</span><span class="lbl">Open in TikTok</span></button>'+
        '<button class="btn b3'+(tk?' on':'')+'" id="bTt" type="button">'+(tk?'✓ Posted on TikTok — tap to undo':'I posted it on TikTok ✓')+'</button>'+
      '</div>';
    }
    h+='<div class="bar" id="bar"><i></i></div>';
    var nx=nextOf(p);
    if(both) h+='<button class="btn nextday" id="bNext" type="button">'+(nx?'Next day’s reel ›':'All reels are posted ✓')+'</button>';
    else h+='<button class="btn nextday wait" type="button" disabled>Confirm '+(!ig&&!tk?'both platforms':!ig?'Instagram':'TikTok')+' to move on to the next day</button><button class="skip" id="bSkip" type="button">Look at the next reel without posting this one</button>';
    h+='<div class="row"><a href="'+esc(p.video)+'" download>Download video</a><a href="https://www.tiktok.com/@advonmedia" target="_blank" rel="noopener">Open my TikTok profile</a></div>'+
      '<p class="pin"><b>Check first:</b> Instagram must say <b>'+HANDLE[P]+'</b> at the top (Profile → tap the name → <b>'+HANDLE[P]+'</b>). TikTok must be on <b>@advonmedia</b>.</p>'+
      '<div class="how"><h4>Instagram</h4><ol>'+
        '<li><b>Copy Instagram caption</b> → <b>Open in Instagram</b> → tap <b>Instagram</b> in the share menu → <b>Reels</b>.</li>'+
        '<li>Music note → pick a song → keep the <b>video’s own sound up</b> (it has the voice), the song <b>low, about 15–20%</b>.</li>'+
        '<li>Paste the caption → leave <b>Share to Facebook</b> OFF → <b>Share</b> → here: <b>I posted it on Instagram ✓</b>.</li>'+
      '</ol>'+(TT_ON[p.id]?'':'<h4>TikTok</h4><ol>'+
        '<li><b>Copy TikTok caption</b> → <b>Open in TikTok</b> → tap <b>TikTok</b> in the share menu.</li>'+
        '<li>Add a trending sound, low, so the voice stays clear.</li>'+
        '<li>Paste the caption → «Disclose post content» <b>off</b> → <b>Post</b> → here: <b>I posted it on TikTok ✓</b>.</li></ol>')+
      '</div>'+
      '<details class="cap"><summary>Show the captions ▾</summary><pre>'+esc(p.caption)+'</pre>'+(TT_ON[p.id]?'':'<pre>TikTok:\n'+esc(p.tiktok)+'</pre>')+'</details>'+
    '</section>';
    return h;
  }
  function row(p,cur){
    var ig=igDone(p.id), tk=ttDone(p.id), o=igDone(p.id,OTHER);
    return '<a class="it'+(ig&&tk?' posted':'')+(p===cur?' cur':'')+'" href="#'+esc(p.id)+'"><img loading="lazy" src="'+esc(p.cover)+'" alt=""><div class="t"><b>'+esc(p.title)+'</b><span>'+esc(p.kind||'')+'</span></div>'+
      '<span class="bd"><span class="o'+(ig?' y':'')+'">IG '+(ig?'✓':'–')+'</span><span class="o'+(tk?' y':'')+'">TikTok '+(tk?'✓':'–')+'</span><span class="o'+(o?' y':'')+'">@'+HANDLE[OTHER]+(o?' ✓':' –')+'</span></span>'+
      '<span class="s">'+(ig&&tk?'✓':'›')+'</span></a>';
  }

  function tabs(){
    document.querySelectorAll('#ptabs button').forEach(function(b){var pp=b.dataset.p;b.classList.toggle('on',pp===P);
      $('#pc'+pp).textContent=data.filter(function(x){return igDone(x.id,pp)&&ttDone(x.id)}).length+' of '+data.length+' done';
      b.onclick=function(){if(pp!==P){location.href=location.pathname+'?p='+pp}}})}
  function render(){tabs();
    if(!data.length){$('#app').innerHTML='<p class="empty">No videos yet.</p>';return}
    var cur=pick(), n=data.filter(complete).length;
    $('#prog').hidden=false;$('#progBar').style.width=Math.round(n/data.length*100)+'%';
    $('#progTxt').innerHTML='<b>'+n+'</b> of '+data.length+' days done (Instagram + TikTok)';
    var h=card(cur);
    h+='<h2>All reels · '+data.length+'</h2><p class="gd">One a day, in this order. A reel counts as done when it is on Instagram @'+HANDLE[P]+' and on TikTok.</p><div class="list">'+data.map(function(p){return row(p,cur)}).join('')+'</div>';
    $('#app').innerHTML=h;
    wire(cur);
  }

  function wire(p){
    var shs=document.querySelectorAll('.js-share'),bar=$('#bar');
    var canShare=!!(navigator.share&&navigator.canShare);
    function label(t){shs.forEach(function(b){b.querySelector('.lbl').textContent=t||(b.dataset.pl==='tt'?'Open in TikTok':'Open in Instagram')})}
    function progress(n){bar.style.display=n>=100?'none':'block';bar.firstChild.style.width=n+'%';if(n<100)label('Preparing video… '+n+'%')}
    function ready(){label();shs.forEach(function(b){b.disabled=false})}
    function fail(){label('Could not load — tap to retry');shs.forEach(function(b){b.disabled=false})}
    if(canShare){shs.forEach(function(b){b.disabled=true});prepare(p,progress).then(ready,fail)}
    $('#bCopy').onclick=function(){copy(p.caption).then(function(ok){toast(ok?'Instagram caption copied ✓':'Copy failed — use «Show the captions»')})};
    if($('#bCopyT'))$('#bCopyT').onclick=function(){copy(p.tiktok).then(function(ok){toast(ok?'TikTok caption copied ✓':'Copy failed — use «Show the captions»')})};
    shs.forEach(function(sh){sh.onclick=function(){
      var tkk=sh.dataset.pl==='tt';
      copy(tkk?p.tiktok:p.caption);   // the right caption is on the clipboard, ready to paste
      if(!canShare){location.href=p.video;return}
      var files=blobs[p.id];
      if(!files){prepare(p,progress).then(ready,fail);return}
      var payload={files:files};
      if(navigator.canShare(payload)){
        navigator.share(payload).then(function(){toast('Caption copied ✓ — paste it in '+(tkk?'TikTok':'Instagram'))},function(e){if(e&&e.name!=='AbortError')toast('Share failed: '+e.name)});
      }else toast('This phone cannot share the video — use Download');
    }});
    function tick(kind,btn){var was=!!(kind==='ig'?igDone(p.id):J(TT_DONE)[p.id]);btn.disabled=true;
      setTick(kind,p.id,!was).then(function(ok){
        var name=kind==='ig'?'Instagram':'TikTok';
        toast(ok?(was?name+': marked as not posted':name+' ✓'+(complete(p)?' — both done!':'')):'Saved on this phone — it will sync when online');
        if(complete(p))try{history.replaceState(null,'','#'+encodeURIComponent(p.id))}catch(e){}   // stay on this reel: show «Both done ✓ · Next day's reel ›»
        render()})}
    $('#bIg').onclick=function(){tick('ig',this)};
    if($('#bTt'))$('#bTt').onclick=function(){tick('tt',this)};
    if($('#bNext'))$('#bNext').onclick=function(){var q=nextOf(p);if(q){location.hash=q.id}else toast('All reels are posted ✓')};
    if($('#bSkip'))$('#bSkip').onclick=function(){var i=data.indexOf(p),q=data[(i+1)%data.length];location.hash=q.id};
  }

  window.addEventListener('hashchange',function(){render();window.scrollTo(0,0)});
  function short(cap,ht){var first=String(cap||'').split(/\n\s*\n/)[0].replace(/\s+/g,' ').trim();var tags=(String(ht||'').match(/#\S+/g)||['#ιστοσελίδα','#advonmedia']).slice(0,5).join(' ');return first+' '+tags}
  Promise.all([fetch(S+'sales.json',{cache:'no-cache'}).then(function(r){return r.json()}),syncDone()]).then(function(r){
    var j=r[0]||{};
    var seenF={},seenT={};
    data=EXTRA.slice().concat((j.posts||[]).filter(function(x){if(x.group==='old'||SKIP[x.id]||!x.media||!x.media[0])return false;var t=String(x.title||'').replace(/[«»]/g,'').trim().toLowerCase();if(seenF[x.media[0]]||seenT[t])return false;seenF[x.media[0]]=1;seenT[t]=1;return true}).map(function(x){
      var cap=String(x.caption||'').trim(), ht=String(x.hashtags||'').trim();
      return {id:x.id,title:NAME[x.id]||String(x.title||'').replace(/[«»]/g,''),kind:String(x.kind||''),
        caption:cap+(ht&&cap.indexOf(ht)<0?'\n\n'+ht:''),tiktok:String(x.tiktok||'').trim()||short(cap,ht),video:S+x.media[0],cover:x.cover?S+x.cover:''};
    }));
    function rk(p){var i=FIRST.indexOf(p.id);return i<0?999:i}
    data.sort(function(a,b){return rk(a)-rk(b)});
    render();flush();
  },function(){$('#app').innerHTML='<p class="empty">Could not load the videos. Pull down to refresh.</p>'});
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&data.length)syncDone().then(function(){render();flush()})});
})();
</script>
</body>
</html>
