<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0E12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TikTok · Advon">
<title>TikTok · Advon Media</title>
<style>
:root{--bg:#0B0E12;--bg2:#131920;--card:#171E26;--line:#26303B;--ink:#F2EEE6;--mute:#9AA4AF;--acc:#3D8BFF;--acc2:#2A6FE0;--ok:#2FBF71;--warn:#E8A33D;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
.wrap{max-width:520px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 0 12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#4C9BFF,#2356C7);display:grid;place-items:center;font-style:normal;font-size:15px}
.brand small{display:block;font-weight:600;color:var(--mute);font-size:12px;letter-spacing:0}
.pill{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:5px 10px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.when{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.when b{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.when span{font-size:13px;color:var(--mute)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:4px 9px;background:#1F2A37;color:#BFD6FF}
.tag.done{background:rgba(47,191,113,.16);color:#7BE3A9}
.tag.miss{background:rgba(232,163,61,.16);color:#F4C27A}
.media{position:relative;display:flex;justify-content:center;background:#07090C;border-radius:16px;overflow:hidden;margin-bottom:14px}
.media img,.media video{display:block;width:auto;max-width:100%;height:auto;max-height:46vh;aspect-ratio:9/16;object-fit:contain}
.media .n{position:absolute;right:10px;top:10px;font-size:12px;font-weight:700;background:rgba(0,0,0,.6);border-radius:99px;padding:4px 9px}
h1{font-size:19px;line-height:1.25;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:14px;padding:16px 14px;font:700 17px/1.2 inherit;font-family:inherit;color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s ease,opacity .2s}
.btn:active{transform:scale(.98)}
.btn .k{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:13px;flex:none}
.b1{background:#26303B}
.b2{background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 10px 26px rgba(61,139,255,.35);margin-top:10px}
.b2[disabled]{opacity:.55}
.b3{background:transparent;border:1.5px solid var(--line);color:var(--ink);margin-top:10px;font-size:15px;padding:13px}
.b3.on{border-color:rgba(47,191,113,.6);color:#7BE3A9}
.row{display:flex;gap:10px;margin-top:10px}
.row a,.row button{flex:1;text-align:center;font-size:13px;color:var(--mute);text-decoration:none;background:none;border:1px solid var(--line);border-radius:12px;padding:10px 8px;font-family:inherit}
.bar{height:4px;border-radius:4px;background:#26303B;overflow:hidden;margin-top:8px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.how{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.how ol{padding-left:22px;color:#D5DAE0;font-size:15px}
.how li{margin:6px 0}
.how li b{color:#fff}
.cap{margin-top:14px}
.cap summary{cursor:pointer;color:var(--mute);font-size:14px;list-style:none}
.cap summary::-webkit-details-marker{display:none}
.cap pre{white-space:pre-wrap;font:14px/1.5 inherit;font-family:inherit;color:#D5DAE0;background:var(--bg2);border-radius:12px;padding:12px;margin-top:8px}
h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:26px 2px 10px}
.list{display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;text-decoration:none;color:inherit}
.it img{width:44px;height:78px;object-fit:cover;border-radius:8px;background:#07090C;flex:none}
.it .t{flex:1;min-width:0}
.it .t b{display:block;font-size:13px;color:var(--acc)}
.it .t span{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.cur{border-color:var(--acc)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:#F2EEE6;color:#0B0E12;font-weight:700;font-size:14px;border-radius:99px;padding:10px 16px;transition:.25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{color:var(--mute);text-align:center;padding:40px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><i>A</i><div>TikTok of the day<small>Advon Media · post from your phone</small></div></div>
    <span class="pill" id="today"></span>
  </header>
  <main id="app"><p class="empty">Loading…</p></main>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var DONE_KEY='advon-tt-done', data=null, blobs={}, loading={};
  var $=function(s,r){return (r||document).querySelector(s)};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function done(){try{return JSON.parse(localStorage.getItem(DONE_KEY)||'{}')}catch(e){return {}}}
  function setDone(id,v){var d=done();if(v)d[id]=new Date().toISOString();else delete d[id];try{localStorage.setItem(DONE_KEY,JSON.stringify(d))}catch(e){}}
  function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  var TODAY=iso(new Date());
  var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','June','July','Aug','Sept','Oct','Nov','Dec'];
  function nice(k){var d=new Date(k+'T12:00:00');return DAYS[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]}
  function rel(k){var a=new Date(TODAY+'T12:00:00'),b=new Date(k+'T12:00:00'),n=Math.round((b-a)/864e5);return n===0?'Today':n===1?'Tomorrow':n===-1?'Yesterday':n<0?(-n)+' days ago':nice(k)}
  var tt;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2600)}
  $('#today').textContent=nice(TODAY);

  function copy(text){
    if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(text).then(function(){return true},function(){return legacy(text)})}
    return Promise.resolve(legacy(text));
  }
  function legacy(text){var a=document.createElement('textarea');a.value=text;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(a);a.select();a.setSelectionRange(0,text.length);var ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();return ok}

  function urls(p){return p.type==='video'?[p.video]:p.photos}
  // fetch the files once and keep them, so the share sheet opens straight from the tap (iOS needs the files ready)
  function prepare(p,onp){
    if(blobs[p.id])return Promise.resolve(blobs[p.id]);
    if(loading[p.id])return loading[p.id];
    var list=urls(p),got=new Array(list.length),tot=0,have=0;
    loading[p.id]=Promise.all(list.map(function(u,i){
      return fetch(u).then(function(r){
        if(!r.ok)throw new Error(r.status);
        var len=+r.headers.get('content-length')||0;tot+=len;
        if(!r.body||!window.ReadableStream)return r.blob();
        var rd=r.body.getReader(),parts=[];
        function pump(){return rd.read().then(function(x){if(x.done)return new Blob(parts,{type:r.headers.get('content-type')||''});parts.push(x.value);have+=x.value.length;onp&&tot&&onp(Math.min(99,Math.round(have/tot*100)));return pump()})}
        return pump();
      }).then(function(b){
        var name=(p.type==='video'?'advon-'+p.date+'.mp4':'advon-'+p.date+'-'+String(i+1).padStart(2,'0')+'.jpg');
        got[i]=new File([b],name,{type:p.type==='video'?'video/mp4':'image/jpeg'});
      });
    })).then(function(){blobs[p.id]=got;onp&&onp(100);return got},function(e){delete loading[p.id];throw e});
    return loading[p.id];
  }

  function card(p){
    var d=done()[p.id], past=p.date<TODAY, n=p.type==='photos'?p.photos.length:0;
    var status=d?'<span class="tag done">Posted ✓</span>':past?'<span class="tag miss">Not posted</span>':'<span class="tag">'+(p.type==='video'?'Reel':'Photo post')+'</span>';
    var media=p.type==='video'
      ?'<video src="'+esc(p.video)+'#t=0.1" poster="'+esc(p.cover)+'" controls playsinline preload="metadata"></video>'
      :'<img src="'+esc(p.cover)+'" alt=""><span class="n">'+n+' photos</span>';
    return '<section class="hero" id="card">'+
      '<div class="when"><b>'+esc(rel(p.date))+' · '+esc(p.time)+'</b>'+status+'</div>'+
      '<div class="media">'+media+'</div>'+
      '<h1>'+esc(p.title)+'</h1>'+
      '<button class="btn b1" id="bCopy"><span class="k">1</span>Copy caption</button>'+
      '<button class="btn b2" id="bShare"><span class="k">2</span><span id="shareTxt">Open in TikTok</span></button>'+
      '<div class="bar" id="bar"><i></i></div>'+
      '<div class="row"><a id="bSave" href="'+esc(urls(p)[0])+'" download>'+(p.type==='video'?'Download video':'Download photos')+'</a><button id="bNext" type="button">Next day ›</button></div>'+
      '<button class="btn b3'+(d?' on':'')+'" id="bDone">'+(d?'✓ Posted — tap to undo':'I posted it ✓')+'</button>'+
      '<div class="how"><ol>'+
        '<li><b>Copy caption</b> (button 1).</li>'+
        '<li><b>Open in TikTok</b> → pick <b>TikTok</b> in the share menu (or «Save '+(p.type==='video'?'Video':'Images')+'», then upload from Photos).</li>'+
        '<li>In TikTok tap <b>Add sound</b> → a trending one → <b>Volume</b> → original sound <b>0</b>.</li>'+
        '<li><b>Next</b> → paste the caption → leave «Disclose post content» <b>off</b> → <b>Post</b>.</li>'+
      '</ol></div>'+
      '<details class="cap"><summary>Show the caption ▾</summary><pre>'+esc(p.caption)+'</pre></details>'+
    '</section>';
  }

  function row(p,cur){
    var d=done()[p.id];
    return '<a class="it'+(cur?' cur':'')+'" href="#'+p.date+'"><img loading="lazy" src="'+esc(p.cover)+'" alt=""><div class="t"><b>'+esc(rel(p.date))+' · '+esc(p.time)+(d?' · posted ✓':'')+'</b><span>'+esc(p.title)+'</span></div></a>';
  }

  function pick(){
    var h=(location.hash||'').slice(1), P=data.posts;
    var byHash=P.find(function(p){return p.date===h||p.id===h});
    if(byHash)return byHash;
    var t=P.find(function(p){return p.date===TODAY});
    if(t)return t;
    return P.find(function(p){return p.date>TODAY})||P[P.length-1];
  }

  function render(){
    var P=data.posts, cur=pick(), dn=done();
    if(!cur){$('#app').innerHTML='<p class="empty">Nothing planned yet.</p>';return}
    var missed=P.filter(function(p){return p.date<TODAY&&p.date>=iso(new Date(Date.now()-4*864e5))&&!dn[p.id]&&p!==cur});
    var next=P.filter(function(p){return p.date>=TODAY&&p!==cur}).slice(0,14);
    var h=card(cur);
    if(missed.length)h+='<h2>Not posted yet</h2><div class="list">'+missed.map(function(p){return row(p)}).join('')+'</div>';
    if(next.length)h+='<h2>Coming up</h2><div class="list">'+next.map(function(p){return row(p)}).join('')+'</div>';
    $('#app').innerHTML=h;
    wire(cur);
  }

  function wire(p){
    var sh=$('#bShare'),txt=$('#shareTxt'),bar=$('#bar');
    var canShare=!!(navigator.share&&navigator.canShare);
    function progress(n){bar.style.display=n>=100?'none':'block';bar.firstChild.style.width=n+'%';if(n<100)txt.textContent='Preparing '+(p.type==='video'?'video':'photos')+'… '+n+'%'}
    function ready(){txt.textContent=p.type==='video'?'Open in TikTok':'Open in TikTok ('+p.photos.length+' photos)';sh.disabled=false}
    if(canShare){sh.disabled=true;prepare(p,progress).then(ready,function(){txt.textContent='Could not load — tap to retry';sh.disabled=false})}
    else ready();
    $('#bCopy').onclick=function(){copy(p.caption).then(function(ok){toast(ok?'Caption copied ✓':'Copy failed — use «Show the caption»')})};
    sh.onclick=function(){
      copy(p.caption);   // the caption is on the clipboard too, so it is ready to paste inside TikTok
      if(!canShare){location.href=urls(p)[0];return}
      var files=blobs[p.id];
      if(!files){prepare(p,progress).then(ready);return}
      var payload={files:files};
      if(navigator.canShare(payload)){
        navigator.share(payload).then(function(){toast('Caption copied ✓ — paste it in TikTok')},function(e){if(e&&e.name!=='AbortError')toast('Share failed: '+e.name)});
      }else{toast('This phone cannot share the files — use Download');}
    };
    $('#bDone').onclick=function(){var was=!!done()[p.id];setDone(p.id,!was);toast(was?'Marked as not posted':'Nice — marked as posted');render()};
    $('#bNext').onclick=function(){var P=data.posts,i=P.indexOf(p);var n=P[i+1];if(n){location.hash=n.date}else toast('That is the last one planned')};
    if(p.type==='photos'){$('#bSave').onclick=function(ev){if(canShare&&blobs[p.id]){ev.preventDefault();navigator.share({files:blobs[p.id]}).catch(function(){})}}}
  }

  window.addEventListener('hashchange',function(){render();window.scrollTo(0,0)});
  fetch('posts.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(d){data=d;render()},function(){$('#app').innerHTML='<p class="empty">Could not load the plan. Pull to refresh.</p>'});
})();
</script>
</body>
</html>
